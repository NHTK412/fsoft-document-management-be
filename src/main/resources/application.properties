server.port=8080
spring.application.name=document_management

# LOG COLOR CONFIG
spring.output.ansi.enabled=ALWAYS

# POSTGRESQL DATABASE CONFIG
spring.datasource.url=jdbc:postgresql://localhost:5432/document_management_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# SPRING DATA JPA & HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false 

# MULTIPART FILE UPLOAD CONFIG
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MINIO / OBJECT STORAGE CONFIG
minio.url=http://localhost:9000
minio.access-key=admin
minio.secret-key=admin123456
minio.bucket-name=document-management

# JWT SECURITY CONFIG
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000 
jwt.refresh-token.expiration=604800000

# AI SERVICE INTEGRATION
# ai.service.url=http://localhost:8000

# OPENAPI / SWAGGER CONFIG
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
